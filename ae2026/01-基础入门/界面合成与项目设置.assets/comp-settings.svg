<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="760" height="480" fill="#faf8f3"/>
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">合成设置（Composition Settings）关键字段</text>
  <text x="380" y="52" text-anchor="middle" font-size="12" fill="#666">菜单入口：合成 → 合成设置，或快捷键 Ctrl+K（先选中合成）</text>

  <!-- 基本 tab -->
  <rect x="40" y="70" width="680" height="330" fill="#ffffff" stroke="#8a7f66"/>
  <rect x="40" y="70" width="120" height="26" fill="#e8e2d5" stroke="#8a7f66"/>
  <text x="100" y="88" text-anchor="middle" font-size="12" font-weight="bold" fill="#333">基本</text>
  <rect x="160" y="70" width="120" height="26" fill="#f5f2ea" stroke="#8a7f66"/>
  <text x="220" y="88" text-anchor="middle" font-size="12" fill="#777">高级</text>

  <text x="60" y="122" font-size="13" fill="#333">合成名称：</text>
  <rect x="150" y="108" width="220" height="22" fill="#fff" stroke="#999"/>
  <text x="158" y="124" font-size="12" fill="#888">Comp 1</text>

  <text x="60" y="158" font-size="13" fill="#333">预设：</text>
  <rect x="150" y="144" width="260" height="22" fill="#fff" stroke="#999"/>
  <text x="158" y="160" font-size="12" fill="#555">自定义 / HDV 1080 25 / 手机竖屏…</text>

  <text x="60" y="194" font-size="13" fill="#333">宽度 × 高度：</text>
  <rect x="150" y="180" width="90" height="22" fill="#fff" stroke="#999"/>
  <text x="158" y="196" font-size="12" fill="#555">1920</text>
  <text x="246" y="196" font-size="13" fill="#555">×</text>
  <rect x="262" y="180" width="90" height="22" fill="#fff" stroke="#999"/>
  <text x="270" y="196" font-size="12" fill="#555">1080</text>

  <text x="60" y="230" font-size="13" fill="#333">像素长宽比：</text>
  <text x="160" y="230" font-size="12" fill="#555">方形像素（国内新媒体/影视都用它）</text>

  <text x="60" y="266" font-size="13" fill="#333">帧速率：</text>
  <rect x="150" y="252" width="80" height="22" fill="#fff" stroke="#999"/>
  <text x="158" y="268" font-size="12" fill="#c0392b" font-weight="bold">25 帧/秒</text>
  <text x="240" y="268" font-size="12" fill="#888">（国内电视/PAL；电影常用 24，网络视频 30 也可）</text>

  <text x="60" y="302" font-size="13" fill="#333">开始时间码：</text>
  <text x="160" y="302" font-size="12" fill="#555">0:00:00:00</text>

  <text x="60" y="338" font-size="13" fill="#333">持续时间：</text>
  <rect x="150" y="324" width="120" height="22" fill="#fff" stroke="#999"/>
  <text x="158" y="340" font-size="12" fill="#c0392b" font-weight="bold">0:00:05:00</text>
  <text x="280" y="340" font-size="12" fill="#888">（笔记示例：0:00:02:00；改时长随时 Ctrl+K）</text>

  <text x="60" y="374" font-size="13" fill="#333">背景色：</text>
  <rect x="150" y="360" width="22" height="22" fill="#666" stroke="#333"/>
  <text x="180" y="376" font-size="12" fill="#555">建议设成中灰色 —— 用来区分「透明」和「真黑色」</text>

  <!-- 高级 tab note -->
  <rect x="40" y="414" width="680" height="50" fill="#f5f2ea" stroke="#8a7f66"/>
  <text x="55" y="434" font-size="12" fill="#333">「高级」标签页里有：3D 渲染器（Classic 3D / Advanced 3D / Cinema 4D）、</text>
  <text x="55" y="452" font-size="12" fill="#333">快门角度（运动模糊）、像素比、折叠变换等 —— 做三维时再来这里切换渲染器。</text>
</svg>
