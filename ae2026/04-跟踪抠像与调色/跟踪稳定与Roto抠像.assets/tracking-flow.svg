<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="960" height="560" fill="#fafbfc"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">AE 跟踪方式选择流程图</text>

  <!-- start -->
  <rect x="380" y="58" width="200" height="44" rx="8" fill="#2f6fed"/>
  <text x="480" y="85" text-anchor="middle" font-size="15" fill="#fff">实拍画面需要"贴/稳"</text>

  <!-- branch question -->
  <polygon points="480,128 620,165 480,202 340,165" fill="#fff3d6" stroke="#e0a83a" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-size="14" fill="#5a4200">画面运动有几个</text>
  <text x="480" y="178" text-anchor="middle" font-size="14" fill="#5a4200">可识别的特征？</text>

  <!-- arrows -->
  <line x1="480" y1="102" x2="480" y2="128" stroke="#555" stroke-width="1.5"/>
  <line x1="340" y1="165" x2="200" y2="165" stroke="#555" stroke-width="1.5"/>
  <line x1="620" y1="165" x2="700" y2="165" stroke="#555" stroke-width="1.5"/>

  <!-- single point -->
  <rect x="60" y="190" width="200" height="70" rx="8" fill="#e8f0ff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="160" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4fb0">单点跟踪</text>
  <text x="160" y="235" text-anchor="middle" font-size="12" fill="#333">只跟位置（比如跟一点发光）</text>
  <text x="160" y="251" text-anchor="middle" font-size="12" fill="#333">跟踪器→跟踪运动→分析→应用空对象</text>

  <!-- two point -->
  <rect x="60" y="290" width="200" height="76" rx="8" fill="#e8f0ff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="160" y="315" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4fb0">两点跟踪</text>
  <text x="160" y="335" text-anchor="middle" font-size="12" fill="#333">位置+旋转 / 位置+缩放</text>
  <text x="160" y="351" text-anchor="middle" font-size="12" fill="#333">两个跟踪点安排在物体对角线上</text>

  <!-- four point -->
  <rect x="60" y="394" width="200" height="76" rx="8" fill="#e8f0ff" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="160" y="419" text-anchor="middle" font-size="14" font-weight="bold" fill="#1d4fb0">四点跟踪</text>
  <text x="160" y="439" text-anchor="middle" font-size="12" fill="#333">透视边角定位（贴广告牌/屏幕）</text>
  <text x="160" y="455" text-anchor="middle" font-size="12" fill="#333">4 个角点顺序不能乱</text>

  <line x1="160" y1="260" x2="160" y2="290" stroke="#555" stroke-width="1.5"/>
  <line x1="160" y1="366" x2="160" y2="394" stroke="#555" stroke-width="1.5"/>

  <!-- 3D camera tracker -->
  <rect x="700" y="130" width="220" height="80" rx="8" fill="#e9f7ee" stroke="#2ea860" stroke-width="1.5"/>
  <text x="810" y="156" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7a44">3D 摄像机跟踪器</text>
  <text x="810" y="176" text-anchor="middle" font-size="12" fill="#333">镜头本身在动，要在三维空间</text>
  <text x="810" y="192" text-anchor="middle" font-size="12" fill="#333">放文字/实底/空白（右键创建）</text>

  <!-- warp stabilizer -->
  <rect x="700" y="238" width="220" height="70" rx="8" fill="#fdeeee" stroke="#d9534f" stroke-width="1.5"/>
  <text x="810" y="263" text-anchor="middle" font-size="14" font-weight="bold" fill="#a93226">变形稳定器</text>
  <text x="810" y="283" text-anchor="middle" font-size="12" fill="#333">手持画面抖动，要"稳"而不是贴</text>
  <text x="810" y="299" text-anchor="middle" font-size="12" fill="#333">跟踪器→变形稳定器，自动分析</text>

  <line x1="810" y1="210" x2="810" y2="238" stroke="#555" stroke-width="1.5"/>

  <!-- bottom note -->
  <rect x="60" y="500" width="860" height="44" rx="8" fill="#f2f3f5" stroke="#999" stroke-width="1"/>
  <text x="490" y="527" text-anchor="middle" font-size="13" fill="#444">通用口诀：特征点要"清晰、与周围色相区别大"；跟不准先查素材是否模糊/运动幅度过大；路径起帧不一定第一帧，找最清晰的画面再开始</text>
</svg>
