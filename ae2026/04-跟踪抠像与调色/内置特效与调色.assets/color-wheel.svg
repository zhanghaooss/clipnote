<svg xmlns="http://www.w3.org/2000/svg" width="520" height="420" viewBox="0 0 520 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="520" height="420" fill="#fafbfc"/>
  <text x="260" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">三原色互补调色环（手写色盘图）</text>

  <!-- color wheel -->
  <circle cx="260" cy="210" r="120" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M260,90 A120,120 0 0,1 364,150 L260,210 Z" fill="#e74c3c"/>
  <path d="M364,150 A120,120 0 0,1 320,314 L260,210 Z" fill="#2ecc71"/>
  <path d="M320,314 A120,120 0 0,1 200,314 L260,210 Z" fill="#3498db"/>
  <path d="M200,314 A120,120 0 0,1 156,150 L260,210 Z" fill="#f1c40f" opacity="0.85"/>
  <path d="M156,150 A120,120 0 0,1 260,90 L260,210 Z" fill="#9b59b6" opacity="0.8"/>

  <!-- labels -->
  <text x="300" y="120" font-size="14" fill="#fff" font-weight="bold">红</text>
  <text x="355" y="250" font-size="14" fill="#fff" font-weight="bold">绿</text>
  <text x="220" y="330" font-size="14" fill="#fff" font-weight="bold">蓝</text>
  <text x="140" y="230" font-size="14" fill="#7a5c00" font-weight="bold">黄</text>
  <text x="200" y="120" font-size="14" fill="#fff" font-weight="bold">品红</text>

  <!-- complementary line -->
  <line x1="180" y1="150" x2="345" y2="275" stroke="#222" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="350" y="290" font-size="13" fill="#222">对角=互补</text>

  <!-- note -->
  <rect x="40" y="360" width="440" height="44" rx="8" fill="#f2f3f5" stroke="#999"/>
  <text x="260" y="380" text-anchor="middle" font-size="12" fill="#444">暗部加青/白/红；羽化区走绿/黄/红；互补色互推对比</text>
  <text x="260" y="396" text-anchor="middle" font-size="12" fill="#444">色阶管暗部/中间调/亮部；曲线管局部；色相饱和度可单独改通道</text>
</svg>
