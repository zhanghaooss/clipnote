<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="820" height="420" fill="#fafbfc"/>
  <text x="410" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">模板工程七大常见问题排查</text>

  <g font-size="12.5" fill="#333">
    <rect x="40" y="60" width="350" height="60" rx="8" fill="#fdeeee" stroke="#d9534f"/>
    <text x="55" y="85" font-weight="bold" fill="#a93226">① QuickTime 缺失</text>
    <text x="55" y="106">MOV 无法导入/导出 → 装对应解码器</text>

    <rect x="430" y="60" width="350" height="60" rx="8" fill="#fdeeee" stroke="#d9534f"/>
    <text x="445" y="85" font-weight="bold" fill="#a93226">② 版本不兼容</text>
    <text x="445" y="106">高版本能开低版本；低版本开不了高版本工程</text>

    <rect x="40" y="135" width="350" height="60" rx="8" fill="#fff3d6" stroke="#e0a83a"/>
    <text x="55" y="160" font-weight="bold" fill="#8a6d00">③ 字体缺失</text>
    <text x="55" y="181">系统未装字体 → 字体替换/安装缺失字体</text>

    <rect x="430" y="135" width="350" height="60" rx="8" fill="#fff3d6" stroke="#e0a83a"/>
    <text x="445" y="160" font-weight="bold" fill="#8a6d00">④ CT generic: not ascii</text>
    <text x="445" y="181">ESC 退出；缺中文字体；换标准字体；提前 Ctrl+S</text>

    <rect x="40" y="210" width="350" height="60" rx="8" fill="#e8f0ff" stroke="#2f6fed"/>
    <text x="55" y="235" font-weight="bold" fill="#1d4fb0">⑤ 素材文件丢失</text>
    <text x="55" y="256">模板素材不全/被移动改名 → 重新定位素材</text>

    <rect x="430" y="210" width="350" height="60" rx="8" fill="#e8f0ff" stroke="#2f6fed"/>
    <text x="445" y="235" font-weight="bold" fill="#1d4fb0">⑥ 表达式错误</text>
    <text x="445" y="256">特效名与新版 AE 不匹配 → 改表达式参数/切语言版本</text>

    <rect x="230" y="285" width="360" height="60" rx="8" fill="#e9f7ee" stroke="#2ea860"/>
    <text x="245" y="310" font-weight="bold" fill="#1e7a44">⑦ 效果丢失</text>
    <text x="245" y="331">插件未装/版本不对 → 装插件或替换效果</text>
  </g>

  <rect x="120" y="365" width="580" height="40" rx="8" fill="#333"/>
  <text x="410" y="390" text-anchor="middle" font-size="13.5" fill="#fff">打包发人：Ctrl+S → 文件 → 整理工程 → 收集文件</text>
</svg>
