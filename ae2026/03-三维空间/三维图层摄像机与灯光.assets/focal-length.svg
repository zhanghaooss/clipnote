<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif, system-ui, sans-serif">
  <rect width="820" height="360" fill="#faf8f3"/>
  <text x="410" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">镜头焦距：同样距离下取景范围对比</text>

  <!-- 广角 -->
  <rect x="30" y="55" width="240" height="220" fill="#fff" stroke="#8a7f66"/>
  <text x="150" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">15–28mm 广角</text>
  <rect x="60" y="120" width="180" height="100" fill="#d8d8d8"/>
  <circle cx="150" cy="170" r="18" fill="#c0392b"/>
  <text x="150" y="248" text-anchor="middle" font-size="11" fill="#666">取景宽、有透视变形</text>
  <text x="150" y="265" text-anchor="middle" font-size="11" fill="#c0392b">笔记：有变形，不常用</text>

  <!-- 标准 -->
  <rect x="290" y="55" width="240" height="220" fill="#fff" stroke="#8a7f66"/>
  <text x="410" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#2d7d32">35 / 50mm 标准</text>
  <rect x="350" y="130" width="120" height="80" fill="#d8d8d8"/>
  <circle cx="410" cy="170" r="18" fill="#c0392b"/>
  <text x="410" y="248" text-anchor="middle" font-size="11" fill="#666">接近人眼，无夸张变形</text>
  <text x="410" y="265" text-anchor="middle" font-size="11" fill="#2d7d32">笔记：最常用，默认就用它</text>

  <!-- 长焦 -->
  <rect x="550" y="55" width="240" height="220" fill="#fff" stroke="#8a7f66"/>
  <text x="670" y="78" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">80–200mm 长焦</text>
  <rect x="630" y="150" width="80" height="40" fill="#d8d8d8"/>
  <circle cx="670" cy="170" r="18" fill="#c0392b"/>
  <text x="670" y="248" text-anchor="middle" font-size="11" fill="#666">空间压缩、远处拉近</text>
  <text x="670" y="265" text-anchor="middle" font-size="11" fill="#c0392b">笔记：远清晰，不常用</text>

  <rect x="30" y="295" width="760" height="50" fill="#f5f2ea" stroke="#8a7f66"/>
  <text x="45" y="318" font-size="12.5" fill="#333">口诀：广角=画面广但变形；长焦=像望远镜；做常规三维动画默认 35/50mm 标准镜头，</text>
  <text x="45" y="337" font-size="12.5" fill="#333">需要「怼近看特写」时才换长焦；摄像机预设在建摄像机对话框里直接选。</text>
</svg>
