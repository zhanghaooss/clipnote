<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="900" height="560" fill="#fafbfc"/>
  <text x="450" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Trapcode Particular 参数模块树</text>

  <!-- root -->
  <rect x="370" y="55" width="160" height="42" rx="8" fill="#2f6fed"/>
  <text x="450" y="81" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Particular</text>

  <!-- emitter -->
  <rect x="40" y="140" width="180" height="150" rx="8" fill="#e8f0ff" stroke="#2f6fed"/>
  <text x="130" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1d4fb0">发射器 Emitter（总开关）</text>
  <g font-size="11.5" fill="#333">
    <text x="52" y="186">行为：连续 / 爆炸</text>
    <text x="52" y="206">粒子/秒：数量（先小后大）</text>
    <text x="52" y="226">类型：点/盒/环/网格/灯/层/OBJ</text>
    <text x="52" y="246">位置 + 位置大小分布</text>
    <text x="52" y="266">速度/随机/速度跟随运动</text>
    <text x="52" y="286">随机种子（换分布）</text>
  </g>

  <!-- particle -->
  <rect x="250" y="140" width="200" height="170" rx="8" fill="#e9f7ee" stroke="#2ea860"/>
  <text x="350" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1e7a44">粒子 Particle</text>
  <g font-size="11.5" fill="#333">
    <text x="262" y="186">生命 + 生命随机</text>
    <text x="262" y="206">类型：发光球/云/条/精灵</text>
    <text x="262" y="226">羽化 / 大小 / 大小随机</text>
    <text x="262" y="246">Size over Life 曲线</text>
    <text x="262" y="266">不透明度 + 生命期不透明度</text>
    <text x="262" y="286">颜色：开始/生命期/随机</text>
    <text x="262" y="306">着色/纹理/时间采样/旋转</text>
  </g>

  <!-- physics -->
  <rect x="480" y="140" width="190" height="170" rx="8" fill="#fff3d6" stroke="#e0a83a"/>
  <text x="575" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#8a6d00">物理 Physics（空气）</text>
  <g font-size="11.5" fill="#333">
    <text x="492" y="186">模式：空气 / 反弹</text>
    <text x="492" y="206">流体：漩涡/时间/速率</text>
    <text x="492" y="226">重力（越大越快）</text>
    <text x="492" y="246">物理时间因数（加速倍数）</text>
    <text x="492" y="266">风向 X/Y/Z + 紊乱场</text>
    <text x="492" y="286">球形场 / 地面墙碰撞</text>
  </g>

  <!-- aux -->
  <rect x="700" y="140" width="170" height="120" rx="8" fill="#fdeeee" stroke="#d9534f"/>
  <text x="785" y="163" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#a93226">辅助系统 Aux</text>
  <g font-size="11.5" fill="#333">
    <text x="712" y="186">继续：主粒子当发射器</text>
    <text x="712" y="206">发射概率（多少粒子生二级）</text>
    <text x="712" y="226">反弹事件：碰撞生二级</text>
    <text x="712" y="246">particles/collision</text>
  </g>

  <!-- bottom row -->
  <rect x="120" y="360" width="160" height="80" rx="8" fill="#f2f3f5" stroke="#999"/>
  <text x="200" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">阴影 Shading</text>
  <text x="200" y="406" text-anchor="middle" font-size="11.5" fill="#555">需灯光；环境/漫反射</text>
  <text x="200" y="424" text-anchor="middle" font-size="11.5" fill="#555">AI 阴影需开二级粒子</text>

  <rect x="310" y="360" width="160" height="80" rx="8" fill="#f2f3f5" stroke="#999"/>
  <text x="390" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">整体变换 Transform</text>
  <text x="390" y="406" text-anchor="middle" font-size="11.5" fill="#555">对粒子群整体变换</text>
  <text x="390" y="424" text-anchor="middle" font-size="11.5" fill="#555">最后整体用</text>

  <rect x="500" y="360" width="160" height="80" rx="8" fill="#f2f3f5" stroke="#999"/>
  <text x="580" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">可见性 Visibility</text>
  <text x="580" y="406" text-anchor="middle" font-size="11.5" fill="#555">出现/消失范围、衰减</text>

  <rect x="690" y="360" width="160" height="80" rx="8" fill="#f2f3f5" stroke="#999"/>
  <text x="770" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#444">渲染 Rendering</text>
  <text x="770" y="406" text-anchor="middle" font-size="11.5" fill="#555">景深（需摄像机）</text>
  <text x="770" y="424" text-anchor="middle" font-size="11.5" fill="#555">运动模糊/快门角度</text>

  <rect x="120" y="475" width="730" height="60" rx="8" fill="#fff" stroke="#2f6fed"/>
  <text x="485" y="500" text-anchor="middle" font-size="13" fill="#333">调参顺序口诀：先发射器定形状和数量 → 粒子定长相（生命/大小/颜色）→ 物理定运动（重力/风向/紊乱场）</text>
  <text x="485" y="522" text-anchor="middle" font-size="13" fill="#333">→ 辅助系统加二级火花 → 最后渲染开景深/运动模糊。先调少量预览，渲染前再把粒子/秒调大</text>
</svg>
