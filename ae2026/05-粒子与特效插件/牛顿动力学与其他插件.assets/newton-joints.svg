<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="400" fill="#fafbfc"/>
  <text x="360" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#222">Newton 2D 动力学：物体与接头类型</text>

  <!-- bodies -->
  <rect x="90" y="120" width="110" height="80" rx="6" fill="#e8f0ff" stroke="#2f6fed" stroke-width="2"/>
  <text x="145" y="165" text-anchor="middle" font-size="13" fill="#1d4fb0">动态物体</text>
  <rect x="330" y="120" width="110" height="80" rx="6" fill="#e9f7ee" stroke="#2ea860" stroke-width="2"/>
  <text x="385" y="155" text-anchor="middle" font-size="13" fill="#1e7a44">静态物体</text>
  <text x="385" y="175" text-anchor="middle" font-size="11.5" fill="#1e7a44">(不动，被撞)</text>
  <rect x="560" y="120" width="110" height="80" rx="6" fill="#fff3d6" stroke="#e0a83a" stroke-width="2"/>
  <text x="615" y="155" text-anchor="middle" font-size="13" fill="#8a6d00">运动学</text>
  <text x="615" y="175" text-anchor="middle" font-size="11.5" fill="#8a6d00">(认关键帧动画)</text>

  <!-- joint -->
  <line x1="200" y1="160" x2="330" y2="160" stroke="#d9534f" stroke-width="3" stroke-dasharray="8,5"/>
  <circle cx="200" cy="160" r="6" fill="#d9534f"/>
  <circle cx="330" cy="160" r="6" fill="#d9534f"/>
  <text x="265" y="145" text-anchor="middle" font-size="12.5" fill="#a93226">距离接头 Distance Joint</text>

  <!-- params -->
  <rect x="90" y="240" width="580" height="120" rx="8" fill="#fff" stroke="#999"/>
  <g font-size="13" fill="#333">
    <text x="110" y="268">· 张力 Tension 0~1：接头拉扯强度</text>
    <text x="110" y="294">· 阻力 / 空气阻尼：运动衰减</text>
    <text x="110" y="320">· 碰撞连接：防止两物体穿插</text>
    <text x="400" y="268">· 锚点工具改连接点位置</text>
    <text x="400" y="294">· 活化 FX 开关：激活/休眠物体</text>
    <text x="400" y="320">· 速度大小/方向：初速度</text>
  </g>
</svg>
