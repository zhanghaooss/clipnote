<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="420" fill="#fdfdf8"/>
  <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#333">画笔设置面板核心参数示意（手写笔记整理）</text>

  <!-- 大小/硬度 -->
  <text x="40" y="72" font-size="15" fill="#333">大小 / 硬度：</text>
  <circle cx="120" cy="100" r="26" fill="none" stroke="#555" stroke-width="2"/>
  <circle cx="120" cy="100" r="14" fill="#999"/>
  <text x="160" y="96" font-size="13" fill="#666">硬度 0%：边缘羽化</text>
  <circle cx="120" cy="140" r="26" fill="#333"/>
  <text x="160" y="145" font-size="13" fill="#666">硬度 100%：硬边方块</text>

  <!-- 角度/圆度 -->
  <text x="40" y="190" font-size="15" fill="#333">角度 / 圆度：</text>
  <ellipse cx="130" cy="220" rx="30" ry="12" fill="#333" transform="rotate(-30 130 220)"/>
  <text x="180" y="216" font-size="13" fill="#666">圆度压扁 + 角度旋转 → 扁笔头</text>
  <ellipse cx="130" cy="252" rx="26" ry="26" fill="#333"/>
  <text x="180" y="257" font-size="13" fill="#666">圆度 100%：正圆笔头</text>

  <!-- 间距 -->
  <text x="40" y="300" font-size="15" fill="#333">间距：</text>
  <g fill="#333">
    <circle cx="120" cy="326" r="10"/>
    <circle cx="148" cy="326" r="10"/>
    <circle cx="176" cy="326" r="10"/>
    <circle cx="204" cy="326" r="10"/>
    <circle cx="232" cy="326" r="10"/>
  </g>
  <text x="260" y="331" font-size="13" fill="#666">间距拉大 → 虚线/点状笔触</text>

  <!-- 动态参数 -->
  <rect x="420" y="70" width="300" height="260" rx="10" fill="#f4f0e4" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="570" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">光点感笔刷三件套</text>
  <text x="445" y="130" font-size="13" fill="#555">☑ 形状动态：大小随压感变</text>
  <text x="445" y="160" font-size="13" fill="#555">☑ 散布：笔触随机散开</text>
  <text x="445" y="190" font-size="13" fill="#555">☑ 平滑：线条防抖</text>
  <line x1="445" y1="210" x2="695" y2="210" stroke="#ccc"/>
  <text x="445" y="238" font-size="13" fill="#555">快捷键：B 画笔 / E 橡皮</text>
  <text x="445" y="266" font-size="13" fill="#555">R 旋转视图 / Ctrl+0 复位</text>
  <text x="445" y="294" font-size="13" fill="#555">Alt+右键拖：调大小硬度</text>
</svg>
