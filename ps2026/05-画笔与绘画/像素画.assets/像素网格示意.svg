<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="640" height="380" fill="#fdfdf8"/>
  <text x="320" y="32" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">像素画工作环境示意</text>

  <!-- 像素网格 -->
  <g transform="translate(60,60)">
    <!-- grid 12x8 cells of 22px -->
    <g stroke="#bbb" stroke-width="1">
      <!-- vertical lines -->
      <line x1="0" y1="0" x2="0" y2="176"/><line x1="22" y1="0" x2="22" y2="176"/><line x1="44" y1="0" x2="44" y2="176"/>
      <line x1="66" y1="0" x2="66" y2="176"/><line x1="88" y1="0" x2="88" y2="176"/><line x1="110" y1="0" x2="110" y2="176"/>
      <line x1="132" y1="0" x2="132" y2="176"/><line x1="154" y1="0" x2="154" y2="176"/><line x1="176" y1="0" x2="176" y2="176"/>
      <line x1="198" y1="0" x2="198" y2="176"/><line x1="220" y1="0" x2="220" y2="176"/><line x1="242" y1="0" x2="242" y2="176"/>
      <line x1="264" y1="0" x2="264" y2="176"/>
      <!-- horizontal lines -->
      <line x1="0" y1="0" x2="264" y2="0"/><line x1="0" y1="22" x2="264" y2="22"/><line x1="0" y1="44" x2="264" y2="44"/>
      <line x1="0" y1="66" x2="264" y2="66"/><line x1="0" y1="88" x2="264" y2="88"/><line x1="0" y1="110" x2="264" y2="110"/>
      <line x1="0" y1="132" x2="264" y2="132"/><line x1="0" y1="154" x2="264" y2="154"/><line x1="0" y1="176" x2="264" y2="176"/>
    </g>
    <!-- 像素小人: 眼睛 -->
    <rect x="88" y="44" width="22" height="22" fill="#333"/>
    <rect x="154" y="44" width="22" height="22" fill="#333"/>
    <!-- 脸 -->
    <rect x="88" y="88" width="88" height="22" fill="#f2c9a0"/>
    <!-- 嘴 -->
    <rect x="110" y="132" width="44" height="22" fill="#d66"/>
  </g>
  <text x="192" y="262" text-anchor="middle" font-size="13" fill="#666">视图 → 显示 → 像素网格（Ctrl+0 放大看格）</text>

  <!-- 右侧要点 -->
  <rect x="380" y="60" width="220" height="200" rx="10" fill="#f4f0e4" stroke="#bbb" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="490" y="88" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">三条硬规则</text>
  <text x="400" y="118" font-size="13" fill="#555">① 画布 72 PPI，一格一像素</text>
  <text x="400" y="146" font-size="13" fill="#555">② 画笔/橡皮都用铅笔（硬边）</text>
  <text x="400" y="174" font-size="13" fill="#555">③ 图像插值改「邻近」</text>
  <text x="400" y="208" font-size="12" fill="#888">PS菜单/编辑 → 首选项 → 常规</text>
  <text x="400" y="230" font-size="12" fill="#888">→ 图像插值：邻近（保留硬边缘）</text>
</svg>
