<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="300" fill="#fdfcf7"/>
  <text x="320" y="30" text-anchor="middle" font-size="18" font-weight="bold">RGB 加色（屏幕发光） vs CMYK 减色（油墨反光）</text>
  <!-- RGB circles -->
  <circle cx="170" cy="140" r="70" fill="rgba(255,0,0,0.55)"/>
  <circle cx="220" cy="140" r="70" fill="rgba(0,200,0,0.55)"/>
  <circle cx="195" cy="190" r="70" fill="rgba(0,80,255,0.55)"/>
  <text x="195" y="285" text-anchor="middle" font-size="14">红+绿+蓝 = 白（越混越亮）</text>
  <!-- CMYK squares -->
  <rect x="380" y="90" width="90" height="90" fill="rgba(0,180,200,0.55)"/>
  <rect x="440" y="90" width="90" height="90" fill="rgba(220,0,140,0.55)"/>
  <rect x="410" y="140" width="90" height="90" fill="rgba(240,200,0,0.55)"/>
  <rect x="445" y="150" width="30" height="30" fill="rgba(0,0,0,0.75)"/>
  <text x="455" y="285" text-anchor="middle" font-size="14">青+品红+黄+黑 = 暗（越混越暗）</text>
  <text x="195" y="60" text-anchor="middle" font-size="13" fill="#555">RGB</text>
  <text x="455" y="60" text-anchor="middle" font-size="13" fill="#555">CMYK</text>
</svg>
