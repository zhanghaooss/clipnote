<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="260" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="17" font-weight="bold">智能对象 = 把原始像素包进保护壳</text>
  <!-- smart object box -->
  <rect x="120" y="60" width="180" height="120" rx="10" fill="#eef4ff" stroke="#3366aa" stroke-width="2.5"/>
  <text x="210" y="82" text-anchor="middle" font-size="13" fill="#3366aa">智能对象图层</text>
  <rect x="150" y="95" width="120" height="60" rx="6" fill="#fff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="210" y="130" text-anchor="middle" font-size="12" fill="#666">原始像素（被保护）</text>
  <text x="210" y="205" text-anchor="middle" font-size="13">缩放 N 次 → 依然清晰 ✅</text>
  <!-- plain pixel -->
  <rect x="380" y="60" width="180" height="120" rx="10" fill="#fff2ee" stroke="#bb5544" stroke-width="2.5"/>
  <text x="470" y="82" text-anchor="middle" font-size="13" fill="#bb5544">栅格化（像素）图层</text>
  <rect x="410" y="95" width="120" height="60" rx="6" fill="#fff" stroke="#999"/>
  <text x="470" y="130" text-anchor="middle" font-size="12" fill="#666">直接改在像素上</text>
  <text x="470" y="205" text-anchor="middle" font-size="13">缩放 N 次 → 越来越糊 ❌</text>
  <text x="320" y="240" text-anchor="middle" font-size="12" fill="#888">右键图层 → 转换为智能对象 / 栅格化图层</text>
</svg>
