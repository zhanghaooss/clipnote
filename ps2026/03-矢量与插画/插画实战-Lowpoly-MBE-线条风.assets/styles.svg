<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="230" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold">三种插画风格气质</text>
  <!-- lowpoly triangle face -->
  <g transform="translate(60,55)">
    <path d="M 60 10 L 110 60 L 60 60 Z" fill="#90caf9"/>
    <path d="M 60 10 L 10 60 L 60 60 Z" fill="#64b5f6"/>
    <path d="M 10 60 L 60 60 L 35 110 Z" fill="#42a5f5"/>
    <path d="M 60 60 L 110 60 L 85 110 Z" fill="#1e88e5"/>
    <text x="60" y="140" text-anchor="middle" font-size="13">Low-poly 切面</text>
  </g>
  <!-- MBE face -->
  <g transform="translate(250,55)">
    <circle cx="60" cy="55" r="45" fill="#fff3e0" stroke="#333" stroke-width="5" stroke-dasharray="70 260 70 260 70 260"/>
    <circle cx="45" cy="48" r="4" fill="#333"/>
    <circle cx="75" cy="48" r="4" fill="#333"/>
    <path d="M 45 70 Q 60 82 75 70" fill="none" stroke="#333" stroke-width="3"/>
    <circle cx="35" cy="62" r="5" fill="#ff8a80" opacity="0.8"/>
    <circle cx="85" cy="62" r="5" fill="#ff8a80" opacity="0.8"/>
    <text x="60" y="140" text-anchor="middle" font-size="13">MBE 断点+可爱</text>
  </g>
  <!-- line face -->
  <g transform="translate(440,55)">
    <circle cx="60" cy="55" r="45" fill="none" stroke="#333" stroke-width="2.5"/>
    <circle cx="45" cy="48" r="3" fill="none" stroke="#333" stroke-width="2"/>
    <circle cx="75" cy="48" r="3" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M 45 72 Q 60 84 75 72" fill="none" stroke="#333" stroke-width="2"/>
    <text x="60" y="140" text-anchor="middle" font-size="13">线条风 干净勾线</text>
  </g>
</svg>
