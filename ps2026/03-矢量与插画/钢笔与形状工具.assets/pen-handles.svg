<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="250" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold">锚点与控制杆：直线点 vs 平滑点</text>
  <!-- smooth anchor -->
  <path d="M 90 180 Q 200 60 310 180" fill="none" stroke="#3366aa" stroke-width="2.5"/>
  <circle cx="200" cy="120" r="6" fill="#333"/>
  <line x1="130" y1="162" x2="270" y2="78" stroke="#bb5544" stroke-width="1.5" stroke-dasharray="5 3"/>
  <circle cx="130" cy="162" r="4" fill="#bb5544"/>
  <circle cx="270" cy="78" r="4" fill="#bb5544"/>
  <text x="200" y="200" text-anchor="middle" font-size="13">平滑点：两根杆同一直线，管一段顺滑曲线</text>
  <!-- corner anchor -->
  <path d="M 420 180 L 500 90 L 580 180" fill="none" stroke="#3366aa" stroke-width="2.5"/>
  <circle cx="500" cy="90" r="6" fill="#333"/>
  <line x1="460" y1="126" x2="500" y2="90" stroke="#bb5544" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="500" y1="90" x2="540" y2="126" stroke="#bb5544" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="500" y="200" text-anchor="middle" font-size="13">角点：两根杆各管各的，折线拐弯</text>
  <text x="320" y="235" text-anchor="middle" font-size="12" fill="#666">Ctrl 调两根 · Alt 单独调一根 · Shift 限 45°/90°</text>
</svg>
