<svg xmlns="http://www.w3.org/2000/svg" width="560" height="440" viewBox="0 0 560 440" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="560" height="440" fill="#fdfdf8"/>
  <text x="280" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">HSL 色相环（首尾相接的八色）</text>

  <!-- color wheel: 8 wedges -->
  <g transform="translate(280,225)">
    <!-- approximate wedge colors going around -->
    <path d="M0,0 L0,-120 A120,120 0 0 1 84.8,-84.8 Z" fill="#e74c3c"/>
    <path d="M0,0 L84.8,-84.8 A120,120 0 0 1 120,0 Z" fill="#e67e22"/>
    <path d="M0,0 L120,0 A120,120 0 0 1 84.8,84.8 Z" fill="#f1c40f"/>
    <path d="M0,0 L84.8,84.8 A120,120 0 0 1 0,120 Z" fill="#2ecc71"/>
    <path d="M0,0 L0,120 A120,120 0 0 1 -84.8,84.8 Z" fill="#1abc9c"/>
    <path d="M0,0 L-84.8,84.8 A120,120 0 0 1 -120,0 Z" fill="#3498db"/>
    <path d="M0,0 L-120,0 A120,120 0 0 1 -84.8,-84.8 Z" fill="#9b59b6"/>
    <path d="M0,0 L-84.8,-84.8 A120,120 0 0 1 0,-120 Z" fill="#e84393"/>
    <circle r="120" fill="none" stroke="#555" stroke-width="1.5"/>
    <circle r="46" fill="#fdfdf8" stroke="#bbb"/>
  </g>

  <!-- labels -->
  <g font-size="14" text-anchor="middle" fill="#333">
    <text x="280" y="88">红</text>
    <text x="378" y="140">橙</text>
    <text x="408" y="230">黄</text>
    <text x="378" y="322">绿</text>
    <text x="280" y="362">青</text>
    <text x="182" y="322">蓝</text>
    <text x="152" y="230">紫</text>
    <text x="182" y="140">品红</text>
  </g>
  <text x="280" y="228" text-anchor="middle" font-size="12" fill="#888">首尾相接</text>

  <text x="280" y="410" text-anchor="middle" font-size="13" fill="#666">调一种色相，相邻 2 个颜色一起跟着动；饱和度 = 灰浅→纯浓，明亮度 = 最暗→最白</text>
</svg>
