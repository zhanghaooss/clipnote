<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="400" fill="#fdfdf8"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">直方图五区域（亮度 0 = 最暗 ～ 255 = 最亮）</text>

  <!-- axis -->
  <line x1="70" y1="320" x2="700" y2="320" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="60" x2="70" y2="320" stroke="#333" stroke-width="1.5"/>
  <text x="40" y="66" font-size="12" fill="#666">像素数</text>
  <text x="60" y="338" font-size="12" fill="#666">0 最暗</text>
  <text x="640" y="338" font-size="12" fill="#666">255 最亮</text>

  <!-- histogram bars distributed across 0-255 -->
  <g fill="#888">
    <rect x="90" y="280" width="16" height="40"/>
    <rect x="130" y="240" width="16" height="80"/>
    <rect x="170" y="200" width="16" height="120"/>
    <rect x="210" y="150" width="16" height="170"/>
    <rect x="250" y="110" width="16" height="210"/>
    <rect x="290" y="90" width="16" height="230"/>
    <rect x="330" y="80" width="16" height="240"/>
    <rect x="370" y="95" width="16" height="225"/>
    <rect x="410" y="120" width="16" height="200"/>
    <rect x="450" y="140" width="16" height="180"/>
    <rect x="490" y="160" width="16" height="160"/>
    <rect x="530" y="190" width="16" height="130"/>
    <rect x="570" y="220" width="16" height="100"/>
    <rect x="610" y="250" width="16" height="70"/>
    <rect x="650" y="285" width="16" height="35"/>
  </g>

  <!-- five region brackets -->
  <g font-size="13" text-anchor="middle">
    <text x="105" y="60" fill="#222">黑色</text>
    <text x="215" y="60" fill="#222">阴影</text>
    <text x="370" y="60" fill="#c00">曝光（中间调）</text>
    <text x="525" y="60" fill="#222">高光</text>
    <text x="660" y="60" fill="#222">白色</text>
  </g>
  <g stroke="#999" stroke-width="1" stroke-dasharray="4 3">
    <line x1="130" y1="66" x2="130" y2="320"/>
    <line x1="300" y1="66" x2="300" y2="320"/>
    <line x1="440" y1="66" x2="440" y2="320"/>
    <line x1="600" y1="66" x2="600" y2="320"/>
  </g>

  <text x="380" y="372" text-anchor="middle" font-size="13" fill="#666">过曝 → 峰值堆在最右端；欠曝 → 峰值堆在最左端；好照片 → 0~255 都有分布且暗部亮部有细节</text>
</svg>
