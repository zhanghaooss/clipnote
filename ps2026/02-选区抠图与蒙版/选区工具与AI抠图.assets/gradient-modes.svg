<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="230" fill="#fdfcf7"/>
  <text x="320" y="26" text-anchor="middle" font-size="16" font-weight="bold">渐变五种模式</text>
  <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff8a65"/><stop offset="1" stop-color="#7e57c2"/></linearGradient></defs>
  <defs><radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff59d"/><stop offset="1" stop-color="#42a5f5"/></radialGradient></defs>
  <defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ef5350"/><stop offset="1" stop-color="#66bb6a"/></linearGradient></defs>
  <defs><linearGradient id="g4" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#26c6da"/><stop offset="0.5" stop-color="#fff"/><stop offset="1" stop-color="#26c6da"/></linearGradient></defs>
  <rect x="30" y="60" width="100" height="70" fill="url(#g1)"/>
  <text x="80" y="150" text-anchor="middle" font-size="13">线性</text>
  <circle cx="200" cy="95" r="35" fill="url(#g2)"/>
  <text x="200" y="150" text-anchor="middle" font-size="13">径向</text>
  <path d="M 320 60 L 360 130 L 280 130 Z" fill="url(#g3)"/>
  <text x="320" y="150" text-anchor="middle" font-size="13">角度</text>
  <rect x="390" y="60" width="100" height="70" fill="url(#g4)"/>
  <text x="440" y="150" text-anchor="middle" font-size="13">对称（反射）</text>
  <path d="M 560 60 L 605 95 L 560 130 L 515 95 Z" fill="url(#g2)"/>
  <text x="560" y="150" text-anchor="middle" font-size="13">菱形</text>
  <text x="320" y="200" text-anchor="middle" font-size="12" fill="#666">拖动方向 = 渐变走向 · 拖动长度 = 渐变范围 · 双击色标改颜色</text>
</svg>
