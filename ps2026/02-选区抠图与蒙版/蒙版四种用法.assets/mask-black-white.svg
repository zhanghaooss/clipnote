<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" font-family="Kaiti SC, KaiTi, STKaiti, cursive, sans-serif">
  <rect width="640" height="240" fill="#fdfcf7"/>
  <text x="320" y="28" text-anchor="middle" font-size="16" font-weight="bold">图层蒙版 = 一张黑白灰度图</text>
  <!-- layer thumbnail -->
  <rect x="60" y="60" width="110" height="110" fill="#ffb74d" stroke="#333"/>
  <text x="115" y="120" text-anchor="middle" font-size="13" fill="#7b3f00">图层内容</text>
  <text x="115" y="190" text-anchor="middle" font-size="12">① 原图</text>
  <!-- mask thumbnail -->
  <rect x="200" y="60" width="110" height="110" fill="#fff" stroke="#333"/>
  <rect x="200" y="60" width="55" height="110" fill="#000"/>
  <text x="255" y="120" text-anchor="middle" font-size="12" fill="#fff">黑</text>
  <text x="227" y="190" text-anchor="middle" font-size="12">② 蒙版：左黑右白</text>
  <!-- result -->
  <rect x="360" y="60" width="110" height="110" fill="#ffb74d" stroke="#333"/>
  <rect x="360" y="60" width="55" height="110" fill="#fdfcf7" stroke="#bbb"/>
  <text x="415" y="120" text-anchor="middle" font-size="12" fill="#7b3f00">右半显示</text>
  <text x="415" y="190" text-anchor="middle" font-size="12">③ 结果：黑半边被擦掉</text>
  <text x="520" y="80" font-size="13">■ 黑 = 透明（藏）</text>
  <text x="520" y="110" font-size="13">□ 白 = 不透明（显）</text>
  <text x="520" y="140" font-size="13">▨ 灰 = 半透明</text>
</svg>
