<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="760" height="300" fill="#fdfdf8"/>
  <text x="380" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">GIF 帧动画面板结构示意</text>

  <!-- film strip -->
  <g transform="translate(60,70)">
    <!-- frames -->
    <g>
      <rect x="0" y="0" width="90" height="70" fill="#fff" stroke="#555" stroke-width="1.5"/>
      <circle cx="45" cy="35" r="18" fill="#555"/>
      <text x="45" y="95" text-anchor="middle" font-size="12" fill="#555">帧 1 · 0.2s</text>
    </g>
    <g>
      <rect x="110" y="0" width="90" height="70" fill="#fff" stroke="#555" stroke-width="1.5"/>
      <circle cx="140" cy="35" r="18" fill="#555" opacity="0.8"/>
      <circle cx="150" cy="35" r="6" fill="#fdfdf8"/>
      <text x="155" y="95" text-anchor="middle" font-size="12" fill="#555">帧 2 · 0.2s</text>
    </g>
    <g>
      <rect x="220" y="0" width="90" height="70" fill="#fff" stroke="#555" stroke-width="1.5"/>
      <circle cx="255" cy="35" r="18" fill="#555"/>
      <circle cx="268" cy="30" r="5" fill="#fdfdf8"/>
      <text x="265" y="95" text-anchor="middle" font-size="12" fill="#555">帧 3 · 0.5s</text>
    </g>
    <g>
      <rect x="330" y="0" width="90" height="70" fill="#fff" stroke="#555" stroke-width="1.5"/>
      <circle cx="375" cy="35" r="18" fill="#555" opacity="0.8"/>
      <path d="M365 42 q10 8 20 0" stroke="#fdfdf8" stroke-width="3" fill="none"/>
      <text x="375" y="95" text-anchor="middle" font-size="12" fill="#555">帧 4 · 0.2s</text>
    </g>
  </g>

  <text x="380" y="210" text-anchor="middle" font-size="13" fill="#666">每帧 = 该帧时全部可见图层的合成结果；帧与帧之间无关联，复制帧 = 加帧</text>
  <text x="380" y="240" text-anchor="middle" font-size="13" fill="#666">全选帧 → 改延迟时间；导出：文件 → 导出 → 存储为 Web 所用格式 → GIF → 256 色 → 永久循环</text>
</svg>
