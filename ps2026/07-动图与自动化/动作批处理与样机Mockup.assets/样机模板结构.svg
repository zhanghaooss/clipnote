<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="720" height="340" fill="#fdfdf8"/>
  <text x="360" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#333">样机（Mockup）模板结构：智能对象 + .psb 嵌套</text>

  <!-- outer mockup -->
  <rect x="60" y="70" width="260" height="180" rx="10" fill="#f4f0e4" stroke="#888" stroke-width="2"/>
  <text x="190" y="95" text-anchor="middle" font-size="14" fill="#333">样机外文件（.psd）</text>
  <text x="190" y="118" text-anchor="middle" font-size="12" fill="#888">投影 / 环境 / 光线效果层</text>
  <rect x="100" y="135" width="180" height="90" rx="4" fill="#fff" stroke="#c00" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="190" y="185" text-anchor="middle" font-size="13" fill="#c00">替换图层（智能对象）</text>

  <!-- arrow -->
  <line x1="320" y1="160" x2="400" y2="160" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <text x="360" y="145" text-anchor="middle" font-size="12" fill="#555">双击进入</text>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#555"/></marker></defs>

  <!-- inner psb -->
  <rect x="410" y="90" width="240" height="140" rx="10" fill="#e8f0e8" stroke="#5a8" stroke-width="2"/>
  <text x="530" y="118" text-anchor="middle" font-size="14" fill="#333">.psb 内部画布</text>
  <text x="530" y="145" text-anchor="middle" font-size="12" fill="#666">置入/替换你的图 → Ctrl+S</text>
  <text x="530" y="168" text-anchor="middle" font-size="12" fill="#666">外文件自动更新贴合并变形</text>
  <text x="530" y="196" text-anchor="middle" font-size="12" fill="#888">.psb = PS 大型图版存储格式</text>

  <text x="360" y="300" text-anchor="middle" font-size="13" fill="#666">保留原样机：改完用「存储为」另存新文件，不要直接保存覆盖原模板</text>
</svg>
