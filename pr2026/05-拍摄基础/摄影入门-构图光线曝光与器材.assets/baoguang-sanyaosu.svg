<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="520" height="360" fill="#faf8f4"/>
  <text x="260" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">曝光三要素（光圈 / 快门 / ISO）</text>
  <polygon points="260,80 100,300 420,300" fill="none" stroke="#8a7a68" stroke-width="2"/>
  <g font-size="14" fill="#333" text-anchor="middle">
    <text x="260" y="70" font-weight="bold">光圈 Aperture</text>
    <text x="260" y="92" font-size="11" fill="#888">大(F2.0)→虚化突出主体</text>
    <text x="260" y="108" font-size="11" fill="#888">小(F11)→前后都清晰拍远景</text>
    <text x="80" y="310" font-weight="bold">快门 Shutter</text>
    <text x="80" y="332" font-size="11" fill="#888">快→凝固运动</text>
    <text x="80" y="348" font-size="11" fill="#888">慢→运动拖影/流水</text>
    <text x="440" y="310" font-weight="bold">ISO 感光度</text>
    <text x="440" y="332" font-size="11" fill="#888">低→干净</text>
    <text x="440" y="348" font-size="11" fill="#888">高→暗部也亮但噪点大</text>
  </g>
</svg>
