<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="880" height="240" fill="#faf8f4"/>
  <text x="440" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">光线方向：顺光 / 侧光 / 逆光</text>
  <!-- 顺光 -->
  <g>
    <circle cx="150" cy="130" r="22" fill="#b08968"/>
    <g stroke="#e0a83c" stroke-width="2">
      <line x1="60" y1="110" x2="120" y2="122"/>
      <line x1="60" y1="130" x2="120" y2="130"/>
      <line x1="60" y1="150" x2="120" y2="138"/>
    </g>
    <text x="150" y="180" text-anchor="middle" font-size="14" fill="#333">顺光</text>
    <text x="150" y="202" text-anchor="middle" font-size="11" fill="#888">光线均匀、立体感好；画面偏平</text>
  </g>
  <!-- 侧光 -->
  <g>
    <circle cx="440" cy="130" r="22" fill="#b08968"/>
    <g stroke="#e0a83c" stroke-width="2">
      <line x1="440" y1="60" x2="440" y2="100"/>
      <line x1="455" y1="60" x2="448" y2="100"/>
      <line x1="425" y1="60" x2="432" y2="100"/>
    </g>
    <text x="440" y="180" text-anchor="middle" font-size="14" fill="#333">侧光</text>
    <text x="440" y="202" text-anchor="middle" font-size="11" fill="#888">立体感、质感强；明暗反差大</text>
  </g>
  <!-- 逆光 -->
  <g>
    <circle cx="730" cy="130" r="22" fill="none" stroke="#b08968" stroke-width="3"/>
    <g stroke="#e0a83c" stroke-width="2">
      <line x1="820" y1="110" x2="760" y2="122"/>
      <line x1="820" y1="130" x2="760" y2="130"/>
      <line x1="820" y1="150" x2="760" y2="138"/>
    </g>
    <text x="730" y="180" text-anchor="middle" font-size="14" fill="#333">逆光</text>
    <text x="730" y="202" text-anchor="middle" font-size="11" fill="#888">剪影、轮廓光；大光比开HDR/补光</text>
  </g>
</svg>
