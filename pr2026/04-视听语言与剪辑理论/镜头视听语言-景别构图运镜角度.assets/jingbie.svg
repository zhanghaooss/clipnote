<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="880" height="300" fill="#faf8f4"/>
  <text x="440" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">景别递进：人物在画面中的占比由远及近</text>
  <!-- boxes -->
  <g stroke="#8a7a68" fill="#fff" stroke-width="1.5">
    <rect x="20"  y="70" width="110" height="150" rx="4"/>
    <rect x="150" y="70" width="110" height="150" rx="4"/>
    <rect x="280" y="70" width="110" height="150" rx="4"/>
    <rect x="410" y="70" width="110" height="150" rx="4"/>
    <rect x="540" y="70" width="110" height="150" rx="4"/>
    <rect x="670" y="70" width="110" height="150" rx="4"/>
  </g>
  <!-- person silhouettes growing -->
  <g fill="#b08968">
    <circle cx="75"  cy="185" r="4"/><line x1="75" y1="189" x2="75" y2="205" stroke="#b08968" stroke-width="2"/>
    <circle cx="205" cy="180" r="6"/><line x1="205" y1="186" x2="205" y2="208" stroke="#b08968" stroke-width="3"/>
    <circle cx="335" cy="160" r="9"/><line x1="335" y1="169" x2="335" y2="208" stroke="#b08968" stroke-width="4"/>
    <circle cx="465" cy="140" r="12"/><line x1="465" y1="152" x2="465" y2="208" stroke="#b08968" stroke-width="5"/>
    <circle cx="595" cy="120" r="18"/><line x1="595" y1="137" x2="595" y2="208" stroke="#b08968" stroke-width="7"/>
    <circle cx="725" cy="110" r="30"/><line x1="725" y1="139" x2="725" y2="208" stroke="#b08968" stroke-width="9"/>
  </g>
  <g font-size="13" fill="#333" text-anchor="middle">
    <text x="75"  y="248">大远景/远景</text>
    <text x="205" y="248">全景</text>
    <text x="335" y="248">中景</text>
    <text x="465" y="248">中近景</text>
    <text x="595" y="248">近景</text>
    <text x="725" y="248">特写/大特写</text>
    <text x="75"  y="268" font-size="11" fill="#888">人&lt;1/4</text>
    <text x="205" y="268" font-size="11" fill="#888">全身</text>
    <text x="335" y="268" font-size="11" fill="#888">膝上</text>
    <text x="465" y="268" font-size="11" fill="#888">腰上</text>
    <text x="595" y="268" font-size="11" fill="#888">胸上</text>
    <text x="725" y="268" font-size="11" fill="#888">肩以上/眼</text>
  </g>
  <text x="440" y="48" text-anchor="middle" font-size="12" fill="#a55">环境镜头 → 关系镜头 → 细节镜头</text>
</svg>
