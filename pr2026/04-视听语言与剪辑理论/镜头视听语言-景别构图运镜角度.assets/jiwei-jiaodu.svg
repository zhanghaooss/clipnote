<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="880" height="300" fill="#faf8f4"/>
  <text x="440" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#333">拍摄高度角度：仰拍 / 平拍 / 俯拍 / 顶拍</text>
  <!-- ground line -->
  <line x1="40" y1="230" x2="840" y2="230" stroke="#bbb" stroke-width="1.5"/>
  <!-- subject -->
  <g fill="#b08968">
    <circle cx="440" cy="180" r="14"/>
    <rect x="428" y="194" width="24" height="36" rx="4"/>
  </g>
  <text x="440" y="252" text-anchor="middle" font-size="13" fill="#333">被摄主体</text>
  <!-- low angle camera (仰拍) -->
  <g>
    <rect x="120" y="200" width="46" height="30" rx="4" fill="#5c7a8a"/>
    <circle cx="166" cy="215" r="8" fill="#3d5a68"/>
    <line x1="166" y1="215" x2="428" y2="185" stroke="#5c7a8a" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="143" y="190" text-anchor="middle" font-size="13" fill="#3d5a68">仰拍</text>
    <text x="143" y="275" text-anchor="middle" font-size="11" fill="#888">高大威猛 / 崇拜 / 压迫</text>
  </g>
  <!-- eye level (平拍) -->
  <g>
    <rect x="300" y="196" width="46" height="30" rx="4" fill="#6a8a5c"/>
    <circle cx="346" cy="211" r="8" fill="#4a6a3c"/>
    <line x1="346" y1="211" x2="426" y2="205" stroke="#6a8a5c" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="323" y="186" text-anchor="middle" font-size="13" fill="#4a6a3c">平拍</text>
    <text x="323" y="275" text-anchor="middle" font-size="11" fill="#888">客观自然 / 平等交流</text>
  </g>
  <!-- high angle (俯拍) -->
  <g>
    <rect x="560" y="120" width="46" height="30" rx="4" fill="#c08a5c"/>
    <circle cx="606" cy="135" r="8" fill="#a06a3c"/>
    <line x1="606" y1="135" x2="452" y2="180" stroke="#c08a5c" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="583" y="110" text-anchor="middle" font-size="13" fill="#a06a3c">俯拍</text>
    <text x="583" y="275" text-anchor="middle" font-size="11" fill="#888">弱小无助 / 交代环境</text>
  </g>
  <!-- top down (顶拍) -->
  <g>
    <rect x="720" y="60" width="46" height="30" rx="4" fill="#8a6a9a"/>
    <circle cx="743" cy="90" r="8" fill="#6a4a7a"/>
    <line x1="743" y1="90" x2="452" y2="166" stroke="#8a6a9a" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="743" y="50" text-anchor="middle" font-size="13" fill="#6a4a7a">顶拍（鸟瞰）</text>
    <text x="743" y="275" text-anchor="middle" font-size="11" fill="#888">展现规模 / 无人机升降</text>
  </g>
</svg>
