<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" font-family="Noto Sans CJK SC, sans-serif">
  <rect width="420" height="300" fill="#faf8f4"/>
  <rect x="30" y="30" width="360" height="220" fill="#e8e2d5" stroke="#8a7a68" stroke-width="2"/>
  <!-- thirds lines -->
  <g stroke="#c0392b" stroke-width="1.2" stroke-dasharray="6,4">
    <line x1="150" y1="30" x2="150" y2="250"/>
    <line x1="270" y1="30" x2="270" y2="250"/>
    <line x1="30" y1="103" x2="390" y2="103"/>
    <line x1="30" y1="177" x2="390" y2="177"/>
  </g>
  <!-- intersections -->
  <g fill="#c0392b">
    <circle cx="150" cy="103" r="4"/>
    <circle cx="270" cy="103" r="4"/>
    <circle cx="150" cy="177" r="4"/>
    <circle cx="270" cy="177" r="4"/>
  </g>
  <!-- subject on intersection -->
  <circle cx="270" cy="150" r="20" fill="#b08968"/>
  <text x="270" y="155" text-anchor="middle" font-size="11" fill="#fff">主体</text>
  <text x="210" y="280" text-anchor="middle" font-size="13" fill="#333">三分法 / 九宫格：主体放在交叉点上</text>
</svg>
